let lang=localStorage.getItem('xomnux-lang')||'es', selected={id:'docker',quantity:1}, config={}; const t=()=>content[lang]; const usd=n=>new Intl.NumberFormat(lang==='fr'?'fr-FR':lang==='es'?'es-GT':'en-US',{style:'currency',currency:'USD'}).format(n);
const monitor=()=>`<div class="monitor"><div class="bar">● ● ● <span>xomnux / production</span></div><aside>▣<br>◈<br>◌</aside><div class="screen"><small>LIVE RESOURCES</small><svg viewBox="0 0 500 130" preserveAspectRatio="none"><path d="M0,98 C32,98 40,45 75,76 S110,115 145,89 S185,30 223,58 S260,101 298,62 S332,17 370,45 S407,96 445,79 S478,29 500,42"/></svg><div class="health"><span>● api-gateway <b>healthy</b></span><span>● worker-eu-01 <b>healthy</b></span><span class="warn">● billing-sync <b>watching</b></span></div></div></div>`;
function card(id){const c=t(),d=c[id],p=product[id];return `<article class="product-card"><header><span>${id.toUpperCase()}</span><i>${p.mark}</i></header><h3>${d[0]}</h3><p>${d[1]}</p><ul>${d[2].map(x=>`<li>✓ ${x}</li>`).join('')}</ul><footer><strong>${usd(p.price)} <small>${c.month}</small></strong><button class="button" data-buy="${id}">${c.buy} →</button></footer></article>`}
function page(){const c=t();return `<header class="nav"><a class="brand" href="#top"><i></i>XOMNUX</a><nav><a href="#products">${c.nav[0]}</a><a href="#platform">${c.nav[1]}</a><a href="#store">${c.nav[2]}</a><a href="#support">${c.nav[3]}</a></nav><div class="langs">${['es','en','fr'].map(l=>`<button class="${l===lang?'active':''}" data-lang="${l}">${l}</button>`).join('')}</div></header><main id="top"><section class="hero"><div><p class="eyebrow">${c.tag}</p><h1>${c.title}</h1><p class="lead">${c.intro}</p><a href="#products" class="button">${c.action} ↓</a><small class="compat">✓ macOS · Windows · Linux</small></div>${monitor()}</section><section id="products" class="section"><p class="eyebrow">${c.products}</p><h2>${c.productsTitle}</h2><div class="grid">${card('docker')}${card('kubernetes')}</div></section><section id="platform" class="platform"><div><p class="eyebrow">${c.platform}</p><h2>${c.platformTitle}</h2></div><div>${c.platforms.map((x,i)=>`<article><span>0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div></section><section id="store" class="store"><div><p class="eyebrow">${c.store}</p><h2>${c.storeTitle}</h2><p>${c.storeText}</p></div><div class="store-list">${['docker','kubernetes'].map(id=>`<button data-buy="${id}"><i>${product[id].mark}</i><span><b>${c[id][0]}</b><small>${usd(product[id].price)} ${c.month}</small></span>→</button>`).join('')}</div></section><section id="support" class="support"><p class="eyebrow">${c.support}</p><h2>${c.supportTitle}</h2><p>${c.supportText}</p><a class="button" href="mailto:support@xomnux.dev">support@xomnux.dev ↗</a></section></main><footer class="footer"><a class="brand" href="#top"><i></i>XOMNUX</a><span>© ${new Date().getFullYear()}</span></footer><div id="modal"></div>`}
function checkout(step='methods'){const c=t(),p=product[selected.id],total=p.price*selected.quantity,summary=`<div class="summary"><b>${c[selected.id][0]}</b><label>${c.quantity}<select id="quantity">${[1,2,3,4,5].map(n=>`<option ${n===selected.quantity?'selected':''}>${n}</option>`).join('')}</select></label><strong>${c.total}: ${usd(total)}</strong></div>`;let body=step==='methods'?`<h2>${c.checkout}</h2><p>${c.methods}</p>${summary}<button class="method" data-method="stripe"><b>${c.card}</b><small>${c.cardText}</small>→</button><button class="method" data-method="btc"><b>${c.btc}</b><small>${c.btcText}</small>→</button>`:'';if(step==='stripe')body=`<button class="back">← ${c.cancel}</button><h2>${c.card}</h2>${summary}<p id="message">${c.loading}</p><form id="payment" hidden><div id="payment-element"></div><button class="button">${c.pay} →</button></form>`;if(step==='btc'){const a=config.bitcoinAddress,uri=a?`bitcoin:${a}?label=Xomnux`:'#';body=`<button class="back">← ${c.cancel}</button><h2>${c.btc}</h2>${summary}<code>${a||c.missing}</code><p>${c.btcHelp}</p><button class="copy" ${a?'':'disabled'}>${c.copy}</button><a class="button ${a?'':'disabled'}" href="${uri}">${c.open} ↗</a>`}document.querySelector('#modal').innerHTML=`<div class="shade"><article class="modal"><button class="close">×</button>${body}</article></div>`;document.querySelector('.close').onclick=()=>document.querySelector('#modal').innerHTML='';document.querySelector('.back')?.addEventListener('click',()=>checkout());document.querySelector('#quantity')?.addEventListener('change',e=>{selected.quantity=Number(e.target.value);checkout(step)});document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{checkout(b.dataset.method);if(b.dataset.method==='stripe')stripePayment()});document.querySelector('.copy')?.addEventListener('click',async e=>{await navigator.clipboard.writeText(config.bitcoinAddress);e.target.textContent=c.copied})}
async function stripePayment(){const c=t(),msg=document.querySelector('#message');try{if(!config.stripePublishableKey||!window.Stripe)throw Error(c.configuring);const r=await fetch('/api/create-payment-intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:selected.id,quantity:selected.quantity})}),j=await r.json();if(!r.ok)throw Error(j.error);const stripe=window.Stripe(config.stripePublishableKey),elements=stripe.elements({clientSecret:j.clientSecret,appearance:{theme:'night',variables:{colorPrimary:'#73e29d'}}});elements.create('payment').mount('#payment-element');document.querySelector('#payment').hidden=false;msg.textContent=c.ready;document.querySelector('#payment').onsubmit=async e=>{e.preventDefault();const {error,paymentIntent}=await stripe.confirmPayment({elements,redirect:'if_required'});msg.textContent=error?error.message:paymentIntent?.status==='succeeded'?'✓ Payment confirmed.':c.loading}}catch(e){msg.textContent=e.message}}
function render(){document.documentElement.lang=lang;document.querySelector('#app').innerHTML=page();document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('xomnux-lang',lang);render()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{selected={id:b.dataset.buy,quantity:1};checkout()})}render();
